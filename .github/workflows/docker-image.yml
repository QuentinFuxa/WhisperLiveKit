name: docker-image

# Prebuilt images for #125: pushed on release tags and manual dispatch.
# ghcr.io/quentinfuxa/whisperlivekit:<tag>[-qwen3] (+ :latest aliases)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (defaults to the ref name)"
        required: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build ${{ matrix.suffix || 'default' }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to publish images to GHCR.
    strategy:
      fail-fast: false
      matrix:
        include:
          - extras: cu129
            suffix: ""
          - extras: cu129,qwen3-streaming
            suffix: "-qwen3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        # GHCR repository names must be lowercase; the owner login is not.
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          image_tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag" >&2
            exit 1
          fi
          printf 'value=%s\n' "$image_tag" >> "$GITHUB_OUTPUT"
          printf 'owner=%s\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            EXTRAS=${{ matrix.extras }}
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner }}/whisperlivekit:${{ steps.tag.outputs.value }}${{ matrix.suffix }}
            ghcr.io/${{ steps.tag.outputs.owner }}/whisperlivekit:latest${{ matrix.suffix }}
          cache-from: type=gha,scope=wlk${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=wlk${{ matrix.suffix }}
