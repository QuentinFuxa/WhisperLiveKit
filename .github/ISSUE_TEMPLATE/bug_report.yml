name: Bug report
description: Report a reproducible problem in WhisperLiveKit
title: "[Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: before-submitting
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and discussions.
          required: true
        - label: I reproduced the problem with the latest WhisperLiveKit release or current main.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest command, configuration, code sample, or audio fixture that reproduces the problem.
      render: shell
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the WhisperLiveKit version, installation method, operating system, Python version, backend, policy, model, device, and relevant flags.
      placeholder: |
        WhisperLiveKit: 0.x.y
        Install: pip
        OS: Ubuntu 24.04
        Python: 3.12
        Backend: faster-whisper
        Policy: simulstreaming
        Model: base
        Device: CPU
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the complete relevant traceback or logs. Remove secrets and private data first.
      render: text

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add recordings, screenshots, profiling results, or other useful context.
